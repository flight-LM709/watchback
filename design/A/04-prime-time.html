<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="style.css">
<style>
:root{--g1:#FF9A3D;--g2:#FF3DA5}
.wrap{padding-top:112px}
h1{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
h1 .hero{display:block;font-size:56px;line-height:1;font-weight:700;letter-spacing:-.045em;margin-top:2px}
.sub{font-size:15px;color:#C4C4CE;margin-top:12px;line-height:1.45}
.sub b{color:#fff}
.card{margin-top:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px 12px 14px}
.cardh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#C4C4CE;margin:0 2px 10px}
.hm{display:grid;grid-template-columns:30px repeat(24,1fr);gap:2px;align-items:center}
.hm .d{font-size:11px;font-weight:600;color:#C4C4CE}
.hm .c{height:16px;border-radius:3px}
.hm .c.peak{outline:2px solid #fff;outline-offset:1px;position:relative;z-index:2;box-shadow:0 0 14px 3px rgba(255,61,165,.8)}
.ax{display:grid;grid-template-columns:30px repeat(24,1fr);gap:2px;margin-top:6px;font-size:10px;color:#B4B4BF;font-weight:600}
.ax span{white-space:nowrap}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:12px;font-size:11px;color:#B4B4BF}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.callout{position:absolute;font-size:11px;font-weight:700;background:#fff;color:#0B0B10;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:3}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px}
.stat small{display:block;font-size:11px;color:#B4B4BF;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:4px}
</style></head><body><div class="screen">
<div class="blob" style="width:300px;height:300px;background:#EA580C;top:-60px;left:-120px;opacity:.5"></div>
<div class="blob" style="width:260px;height:260px;background:#DB2777;bottom:-40px;right:-110px;opacity:.5"></div>
<div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="half"></span><span></span><span></span><span></span></div>
<div class="topbar"><div class="brand"><div class="mark"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10L0 6zM12 1v10L6 6z" fill="#0B0B10"/></svg></div>Watchback</div><span style="font-size:20px;color:#C4C4CE">✕</span></div>
<div class="period">Oct 2025 – Oct 2026 <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></div>
<div class="wrap content">
<h1>Prime time:<span class="hero">Sundays at <span class="grad-text">10 PM</span></span></h1>
<p class="sub">That's when you hit play the most.</p>
<div class="card">
<div class="cardh"><span>Videos started · by day &amp; hour</span><span>WIB</span></div>
<div class="hm" id="hm"></div>
<div class="ax"><span></span><span style="grid-column:span 6">12 AM</span><span style="grid-column:span 6">6 AM</span><span style="grid-column:span 6">12 PM</span><span style="grid-column:span 6">6 PM</span></div>
<div class="legend">Fewer <i style="background:#1E1E28"></i><i style="background:#5A2A2E"></i><i style="background:#B4502E"></i><i style="background:#FF8A3D"></i><i style="background:#FF3DA5"></i> More</div>
</div>
<div class="stats"><div class="stat"><small>Peak slot</small><b>214</b><small style="text-transform:none;letter-spacing:0;margin-top:2px">videos started</small></div><div class="stat"><small>Night owl</small><b>38%</b><small style="text-transform:none;letter-spacing:0;margin-top:2px">after 10 PM</small></div></div>
</div>
<span class="example bl">Example data</span>
<script>
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const pal=['#1E1E28','#3A2230','#5A2A2E','#86392F','#B4502E','#E0692F','#FF8A3D','#FF5E78','#FF3DA5'];
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const hm=document.getElementById('hm');
days.forEach((d,di)=>{const l=document.createElement('div');l.className='d';l.textContent=d;hm.appendChild(l);
for(let h=0;h<24;h++){let base=[.3,.15,.05,0,0,0,0,.05,.15,.2,.25,.3,.4,.35,.3,.3,.35,.45,.55,.65,.75,.8,.85,.6][h];
if(di>=5)base=Math.min(1,base*1.25+(h>8&&h<14?.2:0));let v=base*.85+rnd()*.25;if(di===6&&h===22)v=1.2;
const idx=Math.max(0,Math.min(8,Math.round(v*7)));const c=document.createElement('div');c.className='c'+(di===6&&h===22?' peak':'');c.style.background=di===6&&h===22?'#FF3DA5':pal[Math.min(idx,7)];hm.appendChild(c);}});
</script>
</div></body></html>
